name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards (terminal theme)
        run: python scripts/render_cards.py --theme terminal --palette midnight-cobalt

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile SVG cards [skip ci]"
          file_pattern: "data/contributions.json cards/terminal/*.svg"
