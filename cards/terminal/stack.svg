<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">Stack tecnológico de Zeniwui</title><desc id="desc">Lenguajes, frameworks backend, bases de datos y herramientas principales.</desc><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(5px)}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes tilein{0%{opacity:0;transform:translateY(26px) scale(.94)}65%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-300px) skewX(-20deg)}28%,100%{transform:translateX(520px) skewX(-20deg)}}
.r{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .6s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .75s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}
.live{animation:pulse 1.8s ease-in-out infinite}
.cur{animation:blink 1.05s steps(1) infinite}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.fl{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
.ti{opacity:0;transform-box:fill-box;animation:tilein .8s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .r,.f,.g,.p,.live,.cur,.n,.fl,.ti{animation:none!important;opacity:1!important;transform:none!important}
  .sh{display:none}
}
</style><defs><clipPath id="clip"><rect width="1200" height="210" rx="14"/></clipPath></defs><rect width="1200" height="210" rx="14" fill="#0D1317" stroke="#232ED1" stroke-width="1.5"/><text x="56" y="46" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#eef7fa">Stack Tecnológico</text><g transform="translate(56,74)"><g class="r" style="animation-delay:0ms"><text x="0" y="14" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#89D2DC" letter-spacing="1">01 // LENGUAJES</text><rect x="0" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="47" r="4" fill="#89D2DC"/><text x="30" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Java</text><rect x="168" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="47" r="4" fill="#89D2DC"/><text x="198" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">PHP</text><rect x="0" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="91" r="4" fill="#89D2DC"/><text x="30" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">C++</text><rect x="168" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="91" r="4" fill="#89D2DC"/><text x="198" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Python</text></g></g><g transform="translate(432,74)"><g class="r" style="animation-delay:130ms"><text x="0" y="14" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#6564DB" letter-spacing="1">02 // BACKEND &amp; DATOS</text><rect x="0" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="47" r="4" fill="#6564DB"/><text x="30" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Spring</text><rect x="168" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="47" r="4" fill="#6564DB"/><text x="198" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Laravel</text><rect x="0" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="91" r="4" fill="#6564DB"/><text x="30" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">MySQL</text><rect x="168" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="91" r="4" fill="#6564DB"/><text x="198" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">PostgreSQL</text></g></g><g transform="translate(808,74)"><g class="r" style="animation-delay:260ms"><text x="0" y="14" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#a5b4fc" letter-spacing="1">03 // WORKFLOW</text><rect x="0" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="47" r="4" fill="#a5b4fc"/><text x="30" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Git</text><rect x="168" y="30" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="47" r="4" fill="#a5b4fc"/><text x="198" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">GitHub</text><rect x="0" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="16" cy="91" r="4" fill="#a5b4fc"/><text x="30" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">Automatización</text><rect x="168" y="74" width="156" height="34" rx="8" fill="#101D42" stroke="#232ED1"/><circle cx="184" cy="91" r="4" fill="#a5b4fc"/><text x="198" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#c8d8ee">APIs REST</text></g></g></svg>