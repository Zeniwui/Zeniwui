ect width="444" height="38" rx="12" fill="#162654"/><rect y="26" width="444" height="12" fill="#162654"/><circle cx="22" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="62" cy="19" r="6" fill="#27c93f"/><text x="222" y="24" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" fill="#8299bd">zeniwui@epi-gijon:~</text><g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" transform="translate(22,74)"><text y="0" fill="#89D2DC" class="f" style="animation-delay:260ms">$ whoami</text><text y="28" fill="#eef7fa" class="f" style="animation-delay:380ms">xen // backend &amp; automation</text><text y="66" fill="#89D2DC" class="f" style="animation-delay:520ms">$ cat stack.conf</text><text y="94" fill="#6564DB" class="f" style="animation-delay:640ms">java · spring · php · laravel · python</text><text y="132" fill="#89D2DC" class="f" style="animation-delay:780ms">$ gh status --year</text><text y="160" fill="#c8d8ee" class="f" style="animation-delay:900ms">656 contribs · 8d streak</text><text y="192" fill="#89D2DC" class="f" style="animation-delay:1020ms">$ <tspan class="cur" fill="#eef7fa">█</tspan></text></g></g></g></svg>